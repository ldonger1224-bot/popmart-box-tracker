<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>更新抽盒机</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f7f3ee;
        color: #23201d;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(88vw, 420px);
        display: grid;
        gap: 14px;
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: 1.35rem;
      }

      p {
        margin: 0;
        color: #7d746b;
        line-height: 1.55;
      }

      button {
        min-height: 48px;
        border: 0;
        border-radius: 8px;
        background: linear-gradient(135deg, #ef6f92, #b94368);
        color: white;
        font: inherit;
        font-weight: 900;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>更新程序缓存</h1>
      <p>这里只更新小程序文件，不会删除你已经入库的账本数据。</p>
      <button id="updateButton" type="button">立即更新</button>
      <p id="statusText">如果主屏幕版本不更新，用 Safari 打开这里点一次。</p>
    </main>
    <script>
      const statusText = document.querySelector("#statusText");
      document.querySelector("#updateButton").addEventListener("click", async () => {
        statusText.textContent = "正在清理旧程序缓存...";
        try {
          if ("serviceWorker" in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map((registration) => registration.unregister()));
          }
          if ("caches" in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map((key) => caches.delete(key)));
          }
          statusText.textContent = "更新完成，正在打开新版...";
          window.location.replace(`./?fresh=${Date.now()}`);
        } catch (error) {
          statusText.textContent = "更新失败，请关闭页面后再试一次。";
        }
      });
    </script>
  </body>
</html>
